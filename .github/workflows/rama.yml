name: Update Playlist

on:
  schedule:
    - cron: '0 */6 * * *'  # jalan tiap 6 jam
  workflow_dispatch:       # bisa di-run manual
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python rama.py
      - run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add hasil.m3u
          git diff --staged --quiet || git commit -m "update playlist LIVE EVENT"
          git push
