name: Update Pl Eve
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update playlist
        run: python auto_pll.py

      - name: Commit and Push
        run: |
          git config user.name "deqiatv-bot"
          git config user.email "deqiatv-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto update pl eve [cron-job.org]"
          git pull --rebase origin main
          git push origin main
