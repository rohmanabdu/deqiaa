name: Update Pl Eve
on:
  workflow_dispatch:

# INI KUNCI ANTI TABRAKAN - jangan jalan bareng
concurrency:
  group: update-pl-eve
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update playlist
        run: python auto_pll.py

      - name: Commit and Push
        run: |
          git config user.name "deqiatv-bot"
          git config user.email "deqiatv-bot@users.noreply.github.com"
          
          git add -A
          # kalau gak ada perubahan, stop biar gak push kosong
          git diff --staged --quiet && echo "No changes, skip push" && exit 0
          
          git commit -m "auto update pl eve [cron-job.org]"
          
          # tarik terbaru dengan autostash biar gak konflik
          git pull --rebase --autostash origin main
          
          # push dengan retry 3x
          for i in 1 2 3; do
            git push origin main && break
            echo "Push failed, retry $i..."
            sleep 3
            git pull --rebase --autostash origin main
          done
