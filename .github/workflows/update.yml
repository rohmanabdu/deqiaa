name: Auto Update Playlist
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install requests

      - name: Run script
        run: python auto_playlist.py

      - name: Push hasil
        run: |
          git config user.name "deqiatv-bot"
          git config user.email "bot@deqiatv"
          git add playlist_final.m3u playlist_final.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update playlist"
          git push
