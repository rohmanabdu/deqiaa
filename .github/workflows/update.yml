name: Auto Update Playlist
on:
  schedule:
    - cron: '*/15 * * * *'  # cek tiap 15 menit ada siaran upcoming baru atau tidak
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python auto_playlist.py
      - run: |
          git config user.name "bandeltv-bot"
          git config user.email "bot@bandeltv.xyz"
          git add playlist_final.m3u playlist_final.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update playlist"
          git push
